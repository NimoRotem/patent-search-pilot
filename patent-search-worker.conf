; patent-search-worker, the durable search runner template.
;
; NOT READY TO ENABLE: the current web route still writes to the legacy run_queue and its status
; stream still reads in-process jobs. Enable this unit only in the same deployment that cuts both
; paths over to runstore. Until then it would poll an unused queue and would not make searches
; durable.
;
; After cutover, `supervisorctl restart patent-results` must not kill a search. The web app will
; enqueue a row and read progress, while this process does the work.
;
; After complete stage-resume wiring, restarting THIS unit costs at most the current stage: the
; lease expires, the reaper returns the run to the queue, and the next worker resumes it.
;
; Run two of them if you want the lanes isolated:
;   [program:patent-search-worker-quick]  ... --lanes quick
;   [program:patent-search-worker-deep]   ... --lanes deep
; One worker with no --lanes serves both, oldest first within a priority.
[program:patent-search-worker]
command=/home/nimrod_rotem/patent-search-pilot/.venv/bin/python -m runner.worker
directory=/home/nimrod_rotem/patent-search-pilot/src
autostart=false
autorestart=true
startsecs=10
; SIGTERM makes the worker stop CLAIMING; the run it holds keeps going until it finishes or the
; window below runs out. After the cutover and resume work is complete, a run that does not land
; is reaped and resumed rather than lost, so this becomes a cost knob and not a correctness one.
stopwaitsecs=300
stopsignal=TERM
stopasgroup=false
; if it has to be SIGKILLed, take the whole group so the rerank child cannot be orphaned
killasgroup=true
stderr_logfile=/home/nimrod_rotem/patent-search-pilot/data/patent-search-worker.err.log
stdout_logfile=/home/nimrod_rotem/patent-search-pilot/data/patent-search-worker.out.log
; Mail settings must come from the deployment's verified Resend configuration.
environment=HF_HUB_DISABLE_PROGRESS_BARS="1",PYTHONUNBUFFERED="1",PATENTS_NO_STARTUP="1"
user=nimrod_rotem
