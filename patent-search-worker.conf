; patent-search-worker, the durable search runner.
;
; WHAT CHANGED. Until the cutover this file was a template with autostart=false and a warning that
; enabling it would poll an unused queue. The web route now writes a row and executes nothing, so
; this process IS the search: `supervisorctl restart patent-results` no longer touches a run in
; flight. Restarting THIS unit costs at most the current resumable unit of work, because the lease
; expires, the reaper returns the run to the queue, and the next worker resumes it from its
; checkpoints (one retrieval channel, one reference read, one rescue round).
;
; DURABLE_WORKER_ENABLED is mandatory and the worker FAILS CLOSED without it: a worker spends
; money, so execution is opt-in and an unparseable value is refused rather than guessed. Contrast
; DURABLE_SEARCH_RUNS on patent-results, which falls back to the legacy path on a bad value
; because refusing to serve the site is the worse failure there.
;
; THE MAIL SETTINGS MUST MATCH patent-results. The worker sends "your search is ready", so a
; worker with no transport configured silently drops every completion mail. The deployed copy in
; /etc/supervisor/conf.d/ carries MAIL_TRANSPORT, RESEND_API_KEY, MAIL_FROM and PUBLIC_BASE_URL
; exactly as patent-results.conf does. They are NOT in this file: a credential does not belong in
; the repository.
;
; DEEP_RANK_CHART_WORKERS mirrors the app's value for the same reason. The reading wave's width is
; a production tuning decision, and a worker that used the code default would read at a different
; speed than the box was tuned for.
;
; Run two of them if you want the lanes isolated:
;   [program:patent-search-worker-quick]  ... --lanes quick
;   [program:patent-search-worker-deep]   ... --lanes deep
; One worker with no --lanes serves both, oldest first within a priority.
;
; NEVER `supervisorctl update` or `restart all` to install this: both bounce programs you did not
; mean to touch. `sudo supervisorctl reread && sudo supervisorctl add patent-search-worker`.
[program:patent-search-worker]
command=/home/nimrod_rotem/patent-search-pilot/.venv/bin/python -m runner.worker
directory=/home/nimrod_rotem/patent-search-pilot/src
autostart=true
autorestart=true
startsecs=10
; SIGTERM makes the worker stop CLAIMING; the run it holds keeps going until it finishes or the
; window below runs out. A run that does not land inside it is reaped and resumed rather than
; lost, so this is a cost knob and not a correctness one.
stopwaitsecs=300
stopsignal=TERM
stopasgroup=false
; if it has to be SIGKILLed, take the whole group so the rerank child cannot be orphaned
killasgroup=true
stderr_logfile=/home/nimrod_rotem/patent-search-pilot/data/patent-search-worker.err.log
stdout_logfile=/home/nimrod_rotem/patent-search-pilot/data/patent-search-worker.out.log
environment=HF_HUB_DISABLE_PROGRESS_BARS="1",PYTHONUNBUFFERED="1",PATENTS_NO_STARTUP="1",DURABLE_WORKER_ENABLED="1"
user=nimrod_rotem
