stopwaitsecs=300
stopsignal=TERM
stopasgroup=false
; if it has to be SIGKILLed, take the whole group so the rerank child cannot be orphaned
killasgroup=true
stderr_logfile=/home/nimrod_rotem/patent-search-pilot/data/patent-search-worker-deep.err.log
stdout_logfile=/home/nimrod_rotem/patent-search-pilot/data/patent-search-worker-deep.out.log
