; patents-parsed-embed: the V3 parse-and-embed stream (ops/parsed_embed.py).
;
; Runs BESIDE patents-desc-backfill, never instead of it. The two are disjoint by construction:
; different population (this one stages no `paragraph` chunk for a publication that has rows in
; `paragraphs`), different advisory-lock namespace, different progress table, different
; corpus_release tag, and every row this writes carries ref_id NULL where the backfill's carries
; paragraphs.id.
;
; It runs FROM THE WORKTREE rather than a copy in $HOME, because it is a package (ops/ + src/ +
; sql/) rather than one file, and because the deployed code and the tracked code being the same
; bytes is what makes `git log` an answer to "what is running".
;
; EMBED workers: the Vertex quota is ACCOUNT WIDE and patents-desc-backfill already holds twelve.
; Four here is what is left before 429 RESOURCE_EXHAUSTED, measured at 3 x 16 in an earlier run.
; In `auto` mode the synchronous path is only used below PARSED_BATCH_MIN queued items anyway;
; above it the work goes to a Gemini Batch job, which holds no quota of ours at all.
;
; DISJOINT FROM THE DESCRIPTION BACKFILL BY QUERY, not by care. `patents-desc-backfill` reads
; `FROM paragraphs`; this worker calls `publications_with_paragraphs()` and stages no `paragraph`
; chunk for any publication that has a row there. Measured 2026-08-22 over all 16,586 objects
; workstream C has written: 16,586 resolve to a corpus publication and 0 of them have a
; `paragraphs` row, so the two populations do not currently intersect at all.
;
; autorestart=unexpected with exitcodes=0: a worker that finds the lease held exits 0 on purpose,
; and that must not become a restart loop.
[program:patents-parsed-embed]
command=/home/nimrod_rotem/v3/N-embed/.venv/bin/python -u /home/nimrod_rotem/v3/N-embed/ops/parsed_embed.py 0 1 parsed
directory=/home/nimrod_rotem/v3/N-embed
user=nimrod_rotem
environment=PYTHONUNBUFFERED="1",HOME="/home/nimrod_rotem",BACKFILL_ENV_FILE="/home/nimrod_rotem/v3/N-embed/.env",PARSED_EMBED_WORKERS="4",PARSED_EMBED_MODE="auto",PARSED_BATCH_MIN="5000",PARSED_BATCH_MAX="50000",PARSED_IDLE_SLEEP="120",PARSED_GCS_READERS="12"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=20
stopsignal=TERM
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/home/nimrod_rotem/v3-logs/parsed_embed.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
