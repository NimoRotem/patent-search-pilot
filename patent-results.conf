; patent-results — prior-art search pilot (rotem.ai/patents-data)
; Production WSGI server is gunicorn. The Werkzeug dev server this used to run is single-process,
; has no request timeouts and is not for production use.
; Worker model (1 process x 16 threads) and its rationale: see gunicorn_conf.py.
[program:patent-results]
command=/home/nimrod_rotem/patent-search-pilot/.venv/bin/gunicorn -c /home/nimrod_rotem/patent-search-pilot/gunicorn_conf.py webapp:app
directory=/home/nimrod_rotem/patent-search-pilot/src
autostart=true
autorestart=true
; the worker imports the Retriever family map before it can serve
startsecs=15
; must exceed gunicorn's graceful_timeout (120s) so an in-flight ~3 min search can land
stopwaitsecs=135
; TERM to the gunicorn master only — it owns draining its own workers
stopsignal=TERM
stopasgroup=false
; ...but if it has to be SIGKILLed, take the whole group so the ~1.9 GB rerank child
; can never be orphaned
killasgroup=true
stderr_logfile=/home/nimrod_rotem/patent-search-pilot/data/patent-results.err.log
stdout_logfile=/home/nimrod_rotem/patent-search-pilot/data/patent-results.out.log
environment=HF_HUB_DISABLE_PROGRESS_BARS="1",WEBAPP_HOST="0.0.0.0",WEBAPP_PORT="8631",PYTHONUNBUFFERED="1"
user=nimrod_rotem
