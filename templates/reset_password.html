{% extends "base.html" %}
{% block title %}Choose new password | {{ brand }}{% endblock %}
{% block body %}
<div class="wrap authwrap">
  <section class="panel authcard">
    <h1>Choose a new password</h1>
    {% if error %}<div class="formerror" role="alert">{{ error }}</div>{% endif %}
    <form method="post" class="authform">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="reset-password">New password</label>
      <input id="reset-password" type="password" name="password" required minlength="10"
             maxlength="256" autocomplete="new-password" autofocus>
      <label for="reset-password-confirm">Confirm new password</label>
      <input id="reset-password-confirm" type="password" name="password_confirm" required
             minlength="10" maxlength="256" autocomplete="new-password">
      <button class="btn" type="submit">Set password</button>
    </form>
  </section>
</div>
{% endblock %}
