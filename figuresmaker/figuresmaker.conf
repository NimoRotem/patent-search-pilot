; figuresmaker - the patent figures maker, served at nimo.iptorch.com/figuresmaker/.
;
; Its own process. It shares the sign-in cookie of the app at the ROOT of the domain and reads that
; app's secret key and Postgres settings, but nothing else: a job here is minutes of model calls and
; must not be able to take the search app down with it.
;
; AUTH_ROOT IS THE ROOT APP, WHICH IS NOT THE SEARCH APP. Since the 2026-08-27 cutover the root of
; nimo.iptorch.com is patent-fulltext and the search app sits behind it, so identity comes from
; ~/patent-fulltext (key AND accounts, they are one setting) while PILOT_ROOT stays on the search
; app for figures and corpus. They were the same tree until the cutover; leaving AUTH_ROOT unset
; verifies the root's cookie against the old account table, where the same id is a different person.
;
; To install: `sudo supervisorctl reread` then `sudo supervisorctl add figuresmaker`.
; A CHANGE TO THE `environment=` LINE NEEDS `stop`, `remove`, `reread`, `add` for this program
; alone. A plain `restart` keeps the old environment and looks like the edit did nothing.
; NEVER `supervisorctl update` and never `restart all` on this host: both bounce `patent-results`
; as a side effect and kill whatever prior-art search is running. Restarting `figuresmaker` alone
; is safe; any job it was running dies with it and says so when the browser next polls.
[program:figuresmaker]
command=/home/nimrod_rotem/patent-figures-maker/figuresmaker/run.sh
directory=/home/nimrod_rotem/patent-figures-maker/figuresmaker
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=45
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1",PORT="8639",PILOT_ROOT="/home/nimrod_rotem/patent-search-pilot",AUTH_ROOT="/home/nimrod_rotem/patent-fulltext",FM_DATA_DIR="/home/nimrod_rotem/figuresmaker-data",PATENTS_LOGIN_URL="https://nimo.iptorch.com/login",FM_MAX_CONCURRENT="2"
user=nimrod_rotem
stdout_logfile=/var/log/supervisor/figuresmaker.log
stderr_logfile=/var/log/supervisor/figuresmaker.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
