# The figure compiler, to be inserted into /etc/nginx/sites-enabled/nimo-iptorch.conf inside
# the TLS server block, ABOVE `location /`.
#
# `^~` so it beats the root block: nginx does not order prefix matches by length against "/",
# it takes the first that matches unless one is marked `^~`. The lookup engine and the
# observations docket are already there for the same reason.
#
# The trailing slash on proxy_pass strips /figures before it reaches the app, and
# X-Forwarded-Prefix tells the app to put it back in every link it generates.

    # ---- the figure compiler -------------------------------------------------------------
    location = /figures { return 301 /figures/; }
    location ^~ /figures/ {
        proxy_pass http://patents_figures/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /figures;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # A compilation makes a few dozen model calls and takes minutes. The browser polls
        # rather than holding the request open, but an upload of a 40 MB grant still needs
        # room, and the default 60s read timeout would cut a slow one off.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_max_body_size 48m;
    }

# And, beside the other upstreams at the top of the file:
#
#   upstream patents_figures { server 127.0.0.1:8637 fail_timeout=0; keepalive 8; }
