; patent-figures — the figure compiler, served at nimo.iptorch.com/figures.
;
; Its own process on purpose. It imports the search application's document code and shares its
; session cookie and its publication cache, but a deep search on `patent-results` runs for hours
; and does not survive a restart, so a component still being worked on must not share that
; process.
;
; To install: `sudo supervisorctl reread` then `sudo supervisorctl add patent-figures`.
; NEVER `supervisorctl update` and never `restart all` on this host: both bounce
; `patent-results` as a side effect and kill whatever search is running.
[program:patent-figures]
command=/home/nimrod_rotem/patent-figures/figures_app/run.sh
directory=/home/nimrod_rotem/patent-figures/figures_app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=45
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1",PORT="8637",PILOT_ROOT="/home/nimrod_rotem/patent-search-pilot",PFC_DATA_DIR="/home/nimrod_rotem/patent-figures-data",PATENTS_LOGIN_URL="https://nimo.iptorch.com/login",PFC_MAX_CONCURRENT="2"
user=nimrod_rotem
stdout_logfile=/var/log/supervisor/patent-figures.log
stderr_logfile=/var/log/supervisor/patent-figures.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
