# USPTO utility drawing profile — 37 CFR 1.84 as applied to the parts this compiler controls.
#
# Sheet is US letter. The required blank margins are the ones the rule names (top 2.5 cm, left
# 2.5 cm, right 1.5 cm, bottom 1.0 cm); nothing but the sheet number may sit in them, which the
# geometry validator enforces as a hard boundary rather than a guideline.
#
# Numerals are 1/8 inch (3.2 mm) minimum. This profile draws at 3.6 mm so a numeral survives the
# reduction to two-thirds that the office may apply.
profile_id: uspto_utility
version: "1.0"
title: USPTO utility (37 CFR 1.84)

page:
  width_mm: 215.9
  height_mm: 279.4
  units_per_mm: 10
  margins_mm:
    top: 25.4
    left: 25.4
    right: 15.9
    bottom: 10.0

typography:
  allowed_fonts: ["Helvetica", "Arial", "DejaVu Sans"]
  font_family: "Helvetica, Arial, sans-serif"
  min_reference_height_mm: 3.2
  reference_height_mm: 3.6
  caption_height_mm: 4.0
  char_width_ratio: 0.62

lines:
  min_line_width_mm: 0.20
  stroke_mm: 0.35
  thin_stroke_mm: 0.25
  arrow_length_mm: 3.0
  arrow_width_mm: 1.8

spacing:
  min_component_gap_mm: 5.0
  min_label_gap_mm: 2.0
  leader_clearance_mm: 1.5
  min_node_width_mm: 20.0
  min_node_height_mm: 10.0
  rank_gap_mm: 18.0
  sibling_gap_mm: 10.0
  container_padding_mm: 8.0

annotations:
  reference_numerals_only: true
  allow_component_captions: true
  monochrome: true

figure_numbering:
  label_format: "FIG. {number}"
  sheet_number_format: "{sheet}/{total}"
  label_position: bottom
