; Continuous niche full-text acquisition. Modelled on patents-desc-backfill.conf.
;
; ONE WORKER PER SHARD, AND THE SHARDS MUST BE DISJOINT. `--shard i --of n` takes the partitions
; where partition_id % n == i, so the union of shard 0..n-1 is the whole pool and no two workers
; ever see the same row. TWO are deployed: this one and patents-fulltext-acquire-1. To go to
; three or four, copy this block to -2 / -3 with `--shard 2 --of 4` and so on, AND change --of on
; EVERY existing conf in the same edit. Leaving one worker at `--of 2` while another runs `--of 4`
; is the one mistake that puts two workers on the same partition; the lease still prevents a
; duplicate fetch, but the pool stops being partitioned and the ordering guarantee goes with it.
;
; This program writes only sources_docstore, corpus_ingest_queue, its own fulltext_* tables and
; GCS. `corpus_guard.arm()` runs before anything else, so a write to a live retrieval table is
; refused inside the process, before Postgres is asked.
;
; SAFE TO: start, stop, restart, add a second shard.
; NEVER: restart patent-results, and never stop patents-desc-backfill.
;   stop this one with:  sudo supervisorctl stop patents-fulltext-acquire
;   it finishes the batch in flight, releases its leases, and exits within stopwaitsecs.

[program:patents-fulltext-acquire]
command=/home/nimrod_rotem/v3/C-fulltext/.venv/bin/python -u
    /home/nimrod_rotem/v3/C-fulltext/ops/fulltext_acquire.py run --shard 0 --of 2
directory=/home/nimrod_rotem/v3/C-fulltext
user=nimrod_rotem
environment=
    HOME="/home/nimrod_rotem",
    FULLTEXT_GCS_BUCKET="nimo-patents-fulltext",
    FULLTEXT_BATCH="24",
    FULLTEXT_IN_FLIGHT="6",
    FULLTEXT_LEASE_SECONDS="600",
    FULLTEXT_SELFSERP_CONCURRENCY="2",
    FULLTEXT_SELFSERP_MIN_INTERVAL="1.5",
    FULLTEXT_SB_CONCURRENCY="6",
    FULLTEXT_SERPAPI_BUDGET="1500",
    FULLTEXT_SCRAPINGBEE_BUDGET="300000",
    FULLTEXT_HIMMPAT_BUDGET="150"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=20
stopsignal=TERM
stopwaitsecs=300
redirect_stderr=true
stdout_logfile=/home/nimrod_rotem/v3-logs/fulltext_acquire_0.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
